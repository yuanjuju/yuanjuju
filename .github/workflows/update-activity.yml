name: Update activity chart

on:
  schedule:
    - cron: '43 16 * * *' # daily 16:43 UTC = 00:43 Beijing, right after the local day ends
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate calendar from public data
        run: python scripts/update_activity.py
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            echo 'No changes; calendar already current.'
            exit 0
          fi
          git commit -m "chore(assets): refresh activity calendar to $(date -u +%F)"
          git push
